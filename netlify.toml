[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # CRA's bundled eslint-config-react-app trips on a jest env key with this
  # toolchain version; linting is a dev concern, not a build blocker.
  DISABLE_ESLINT_PLUGIN = "true"
  CI = "false"

# Long-cache hashed static assets.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
